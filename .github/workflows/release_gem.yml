# Replica of Shopify/ruby-lsp .github/workflows/release_gem.yml (blob 3bcc71c322dcf996789bedec0a781585a01e2de6).
# Same repository, same push-a-tag trigger shape as release_extension.yml above.
# The difference is line 19 and line 25.
name: Release gem on RubyGems.org

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

jobs:
  release_gem:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    environment: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release gem on RubyGems.org
        run: echo "rubygems/release-gem would run here over OIDC, with no stored token"
